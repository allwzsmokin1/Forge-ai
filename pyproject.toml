[project]
name = "forge-ai"
version = "0.0.1"
description = "Open-source multi-agent software engineering platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
        { name = "ForgeAI Contributors" }
]

dependencies =  [
    "fastapi",
    "uvicorn",
    "typer",
    "rich",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "pyyaml",
]

[project.scripts]
forge = "forge.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ["py312"]
