name: Validation

on:
  push:
    branches:
      - main
      - master
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: black --target-version py312 --check .

      - name: Run lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q
